services:
  db:
    image: postgres:18-alpine
    container_name: agentshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentshelf
      POSTGRES_USER: agentshelf
      POSTGRES_PASSWORD: agentshelf
    ports:
      - "5432:5432"
    volumes:
      - agentshelf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshelf -d agentshelf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentshelf-postgres:
